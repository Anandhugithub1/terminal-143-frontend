// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Build output is redirected outside OneDrive: the sync client locks/deletes
// files in this tree while Gradle is mid-write (many small resource files
// under merged_res_blame_folder / incremental), causing intermittent
// AccessDeniedException / "Unable to delete directory" build failures.
def externalBuildDir = new File("C:/GradleBuilds/terminal-143-frontend")
rootProject.buildDir = new File(externalBuildDir, "root")
subprojects {
    project.buildDir = new File(externalBuildDir, project.name)
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
