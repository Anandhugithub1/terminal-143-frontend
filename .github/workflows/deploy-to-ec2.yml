name: Deploy to EC2 via SSM

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::397385402720:role/GithubActionsSSMRole
          aws-region: us-east-1

      - name: (optional) Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Send deploy command to EC2 via SSM (run as ec2-user)
        id: sendcmd
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"
          # Use a JSON array string for --parameters. Each array element is a command executed by AWS-RunShellScript.
          # We run each command with sudo -i -u ec2-user so commands execute as ec2-user (has correct git SSH keys & ownership).
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions deploy" \
            --parameters commands='[
              "sudo -i -u ec2-user bash -lc \"cd /home/ec2-user/terminal-143-frontend && git fetch origin --quiet && git reset --hard origin/main\"",
              "sudo -i -u ec2-user bash -lc \"cd /home/ec2-user/terminal-143-frontend && chmod +x ./deploy.sh\"",
              "sudo -i -u ec2-user bash -lc \"/home/ec2-user/terminal-143-frontend/deploy.sh\""
            ]' \
            --query "Command.CommandId" --output text)
          echo "command-id=$CMD_ID" >> $GITHUB_OUTPUT
          echo "Sent SSM command id: $CMD_ID"

      - name: Wait for command to finish and print output
        run: |
          set -euo pipefail
          INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"
          CMD_ID="${{ steps.sendcmd.outputs.command-id }}"
          echo "Polling command $CMD_ID on $INSTANCE_ID ..."
          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i - Status: $STATUS"
            if [[ "$STATUS" == "Success" || "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "---- Command output (stdout) ----"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text || true
              echo "---- Command output (stderr) ----"
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text || true
              if [[ "$STATUS" != "Success" ]]; then
                echo "Command finished with status: $STATUS"
                exit 1
              fi
              exit 0
            fi
          done
          echo "Command did not finish in time"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --output text || true
          exit 1
