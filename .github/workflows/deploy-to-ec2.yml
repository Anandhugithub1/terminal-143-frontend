\name: Deploy to EC2 via SSM

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::397385402720:role/GithubActionsSSMPolicy
          aws-region: us-east-1

      - name: Deploy using SSM
        run: |
          INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"  
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions deploy" \
            --parameters commands=["cd /home/ec2-user/terminal-143-frontend","chmod +x ./deploy.sh","./deploy.sh"]
