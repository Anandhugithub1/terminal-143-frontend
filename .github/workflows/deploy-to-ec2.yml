name: "Deploy to EC2"

on:
  push:
    branches:
      - "main"

jobs:
  deploy:
    runs-on: self-hosted  

    steps:
      - name: "Checkout code"
        uses: "actions/checkout@v3"

      - name: "Install SSH key"
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: "Add EC2 host to known_hosts"
        run: |
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts || true

      - name: "Debug: DNS resolution & ping"
        run: |
          echo "Resolving ${{ secrets.EC2_HOST }}…"
          nslookup "${{ secrets.EC2_HOST }}" || true
          ping -c 4 "${{ secrets.EC2_HOST }}" || true

      - name: "Debug: test SSH key"
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/id_ed25519 \
              ec2-user@"${{ secrets.EC2_HOST }}" \
              "echo '✅ SSH connection successful'" || true

      - name: "SSH & Deploy"
        uses: "appleboy/ssh-action@v0.1.7"
        with:
          host: "${{ secrets.EC2_HOST }}"
          username: "ec2-user"
          key: "${{ secrets.EC2_SSH_KEY }}"
          script: |
            cd ~/terminal-143-frontend
            git pull origin main
            npm install
            npm run build
