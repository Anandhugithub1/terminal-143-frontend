name: iOS Build (Manual / One-Time)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Ensure @capacitor/ios is installed
        run: npm install @capacitor/ios

      - name: Add or sync iOS platform
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            npx cap copy ios
          fi
          npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install --repo-update

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Open PR to commit the generated ios/ folder
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add iOS platform via Capacitor"
          title: "Add iOS platform (generated by Capacitor)"
          body: |
            Auto-generated by the "iOS Build (Manual / One-Time)" workflow.

            Adds the native `ios/` project via `npx cap add ios` + `npx cap sync ios`,
            with CocoaPods dependencies resolved (`Podfile.lock`). Verified it builds
            successfully for the iOS Simulator before this PR was opened.
          branch: ci/add-ios-platform
          delete-branch: true
          add-paths: |
            ios

      - name: Boot simulator, install app, and capture screenshot
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("iPhone"))][0].udid')
          echo "Using simulator device: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

          APP_PATH=$(find build/Build/Products -maxdepth 3 -name "*.app" | head -1)
          echo "App bundle: $APP_PATH"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.passormatch

          sleep 5
          xcrun simctl io "$DEVICE_ID" screenshot ios-simulator-screenshot.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshot
          path: ios-simulator-screenshot.png

      - name: Upload built .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-build
          path: build/Build/Products/**/*.app
