name: iOS Build (Manual / One-Time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Ensure @capacitor/ios is installed
        run: npm install @capacitor/ios@8.4.2

      - name: Add or sync iOS platform
        run: |
          set -euo pipefail
          if [ ! -d "ios" ]; then
            npx cap add ios --packagemanager SPM
          else
            npx cap copy ios
          fi
          echo "--- ios/App contents after add/copy ---"
          ls -la ios/App || true
          npx cap sync ios

      - name: Verify Xcode project exists
        run: |
          set -euo pipefail
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "::error::ios/App/App.xcodeproj was not generated. Dumping ios/ tree for debugging:"
            find ios -maxdepth 3 || true
            exit 1
          fi
          echo "Xcode project found. ios/App contents:"
          ls -la ios/App

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Commit generated ios/ folder directly to the repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios
          if git diff --cached --quiet; then
            echo "No changes to ios/ - skipping commit"
          else
            git commit -m "Add/update iOS platform via Capacitor"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Boot simulator, install app, and capture screenshot
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("iPhone"))][0].udid')
          echo "Using simulator device: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

          APP_PATH=$(find build/Build/Products -maxdepth 3 -name "*.app" | head -1)
          echo "App bundle: $APP_PATH"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.passormatch

          sleep 5
          xcrun simctl io "$DEVICE_ID" screenshot ios-simulator-screenshot.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshot
          path: ios-simulator-screenshot.png

      - name: Upload built .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-build
          path: build/Build/Products/**/*.app
