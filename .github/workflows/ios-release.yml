name: iOS Release (signed, via match)

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload the build to TestFlight after signing"
        type: boolean
        default: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Ensure @capacitor/ios is installed
        run: npm install @capacitor/ios@8.4.2

      - name: Sync iOS platform
        run: npx cap sync ios

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App

      - name: Build authenticated match git URL
        env:
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          set -euo pipefail
          # Strip any trailing newline/whitespace that may have been baked into the
          # base64 payload (e.g. `echo "user:token" | base64` instead of `echo -n`),
          # which otherwise corrupts the token and GitHub rejects it outright.
          DECODED=$(printf '%s' "$MATCH_GIT_BASIC_AUTHORIZATION" | base64 --decode | tr -d '\r\n')
          USERNAME="${DECODED%%:*}"
          TOKEN="${DECODED#*:}"
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$DECODED"
          echo "Decoded username length: ${#USERNAME}, token length: ${#TOKEN}"
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "::error::MATCH_GIT_BASIC_AUTHORIZATION did not decode into 'username:token' - check the secret was created with 'printf' (not 'echo') before base64 encoding."
            exit 1
          fi
          echo "MATCH_GIT_URL=https://${USERNAME}:${TOKEN}@github.com/Anandhugithub1/passormatch-certificates-" >> "$GITHUB_ENV"

      - name: Fetch certs and build signed archive
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: bundle exec fastlane release

      - name: Upload to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: bundle exec fastlane beta

      - name: Upload .ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: build/App.ipa
          if-no-files-found: ignore
